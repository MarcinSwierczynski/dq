spring.application.name=dq-http-example
spring.mvc.problemdetails.enabled=true
# Rule definitions (JSON); the logic they name is registered in ExampleCatalog.
dq.http.catalog=classpath:rules.json
# Largest batch the buffered JSON response accepts; use Accept: application/x-ndjson beyond it.
dq.http.max-records=10000
# Largest batchSize a client may request. The engine buffers one batch, so this bounds streaming memory.
dq.http.max-batch-size=10000
# Streaming runs can outlast the default async timeout.
spring.mvc.async.request-timeout=30m
